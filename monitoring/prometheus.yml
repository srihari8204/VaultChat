# Prometheus scrape config — VaultChat monitoring profile (UITE §19).
# Runs in-network; go-api's /internal/metrics is unreachable publicly (Caddy 404).
global:
  scrape_interval: 15s

# Alert rules. Loading them needs a prometheus restart, which has NOT been done
# — see the status note at the top of alerts.yml. Rules also do not notify
# anyone without an Alertmanager, which this box does not run.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: go-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['go-api:4000']

  # openspec: microservices-maps-pilot. Down (not alerting) while maps-api is
  # stopped; Caddy serves /nav/* from go-api then.
  - job_name: maps-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['maps-api:4000']
