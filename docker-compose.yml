# docker-compose.yml — VaultChat platform substrate (dev / staging).
#
# Brings up the full backend stack so we can build the new architecture WITHOUT
# touching the live pm2 deployment:
#   - postgres   : primary database
#   - redis      : cache + presence + Socket.IO adapter + queues
#   - kafka      : durable message bus (KRaft mode, no Zookeeper)
#   - minio      : S3-compatible object storage for media (swap for Cloudflare R2 in prod)
#   - api        : the backend (built from vaultchat-backend/Dockerfile)
#
# Usage (on the Hetzner box or any Docker host):
#   docker compose up -d
#   docker compose logs -f api
#
# pgbouncer + the fan-out/push workers get added as we extract those services.

services:
  # ── caddy — THE migration switch (Phase 2 Step 2) ────────────────────
  # The app keeps ONE SERVER_URL pointed here. Every path routes to Node by
  # default; caddy/Caddyfile flips individual routes to the Go backend with
  # one line each (and back — that's the per-route instant rollback).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The privacy policy and account-deletion pages Google Play fetches during
      # review. Read-only, static, and served by the @legal route in the
      # Caddyfile — no backend involvement, so they stay up even if go-api does
      # not, which is the point: a policy URL that 502s fails the review.
      - ./caddy/public:/srv/public:ro
    ports:
      - "18080:80"            # bench/staging entry; docker-compose.prod.yml maps 80/443
    # livekit runs with network_mode: host (RTC needs the host's real address),
    # so Caddy cannot reach it by service name. On Linux host.docker.internal
    # does NOT resolve by default — this mapping is what makes the /livekit
    # route in the Caddyfile work rather than 502.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - go-api

  # ── go-api — the strangler backend (Phase 2 Step 3+) ─────────────────
  # Serves only the routes Caddy sends it; shares the SAME postgres/redis/
  # kafka/minio as Node. Never receives traffic unless the Caddyfile says so.
  go-api:
    build:
      context: ./vaultchat-backend-go
    restart: unless-stopped
    env_file:
      - path: ./vaultchat-backend/.env     # same JWT_SECRET etc. as Node
        required: false
    environment:
      PORT: "4000"
      # P2.3: route DB traffic through PgBouncer (transaction pooling) so N
      # go-api replicas share a bounded set of real Postgres connections.
      # Rollback: DB_HOST=postgres / DB_PORT=5432 for a direct connection.
      DB_HOST: ${DB_HOST:-pgbouncer}
      DB_PORT: ${DB_PORT:-6432}
      DB_NAME: vaultchat
      DB_USER: vaultchat
      DB_PASS: ${DB_PASS:-vaultchat_dev}
      # P2.1: REDIS_ADAPTER=1 turns on the Socket.IO Redis adapter + Redis
      # presence/rosters (cluster.go) so go-api can scale past one replica.
      # On by default (SCALEOUT.md canary step 2) — single-node behavior must be
      # identical, and it removes the flag-flip from the moment you actually
      # need a second replica. Rollback: REDIS_ADAPTER=0 in .env, restart.
      # Redis unreachable ⇒ every helper fails open to the local maps anyway.
      REDIS_ADAPTER: ${REDIS_ADAPTER:-1}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: ""
      # OBJECT STORE — interpolated from the PROJECT-ROOT .env or the host
      # shell. NOT from `env_file:` below.
      #
      # Read that twice, because the distinction is invisible and expensive.
      # `env_file:` here is vaultchat-backend/.env. Anything under
      # `environment:` overrides it — and a `${VAR:-default}` is still an
      # `environment:` entry, so when VAR is unset the DEFAULT materialises and
      # still wins over that file. Parameterising these keys did NOT hand
      # control to vaultchat-backend/.env; it handed control to
      # ./.env (this directory) and the shell.
      #
      # So: to point this at R2, put S3_* in the PROJECT-ROOT .env. Putting
      # them in vaultchat-backend/.env changes nothing, silently, with no
      # error to explain it — which is exactly the trap that made "swap MinIO
      # for R2" look like a code problem.
      #
      # The `:-` defaults reproduce the previous literals EXACTLY, so a
      # deployment that sets nothing behaves byte-for-byte as before.
      #
      # One root .env also feeds the egress block further down, so a single
      # file moves BOTH halves of object storage — which is the only reason
      # they cannot drift apart during a cutover.
      #
      # S3_REGION must be `auto` for R2. MinIO ignores region entirely, so the
      # default is safe in both and stops storage.go (auto) and egress.go
      # (us-east-1) signing under different SigV4 scopes against one bucket.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://65.21.229.167:19000}
      S3_BUCKET: ${S3_BUCKET:-vaultchat-media}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_USER:-vaultchat}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_PASS:-vaultchat_dev_secret}}
      # BROADCAST STORE — a SEPARATE object store from the media store above.
      #
      # This deployment splits them and the split is invisible from this file:
      # docker-compose.box.yml (not in git) points S3_* at Cloudflare R2, while
      # the LiveKit egress service is not overridden there and keeps writing HLS
      # segments to minio:9000. Two stores, one set of S3_* variables.
      #
      # Without these, the playback relay authenticates to MinIO with R2
      # credentials and every segment request 404s — which is exactly what it
      # did. Defaults match what the egress service uses, so the writer and the
      # reader agree with no additional configuration.
      #
      # Point BROADCAST_S3_* at R2 the day segments move there and the split
      # collapses back to a single store.
      BROADCAST_S3_ENDPOINT: ${BROADCAST_S3_ENDPOINT:-http://minio:9000}
      BROADCAST_S3_ACCESS_KEY: ${BROADCAST_S3_ACCESS_KEY:-${MINIO_USER:-vaultchat}}
      BROADCAST_S3_SECRET_KEY: ${BROADCAST_S3_SECRET_KEY:-${MINIO_PASS:-vaultchat_dev_secret}}
      BROADCAST_BUCKET: ${BROADCAST_BUCKET:-vaultchat-broadcast}
      # Socket emits from Go-served routes bridge to the Node process (which
      # owns all sockets until Step 5). Internal-only; never proxied by Caddy.
      NODE_INTERNAL_URL: http://api:3000
      INTERNAL_EMIT_KEY: ${INTERNAL_EMIT_KEY:-bench-internal-emit}
      # LiveKit — the backend only SIGNS tokens (internal/livekit/token.go); it
      # never calls the SFU, so these are credentials, not a connection. Absent,
      # POST /calls/{id}/sfu-token answers 503 with a reason and the mesh keeps
      # working unchanged. LIVEKIT_URL is what the CLIENT dials, so it must be
      # the public wss:// address, not the in-network one.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      # The IN-NETWORK address, as distinct from LIVEKIT_URL above which is
      # what the CLIENT dials. Set on the box and missing from this file until
      # now, so a rebuild from the repository dropped it, RPCURL went empty,
      # and same-box twirp calls routed out to the edge and back in. That has
      # already happened once in production.
      LIVEKIT_HTTP_URL: ${LIVEKIT_HTTP_URL:-}
      # ── GO LIVE — a SEPARATE LiveKit project, never these credentials ──
      #
      # Broadcasting used to mint tokens from LIVEKIT_* above: same key, same
      # secret, same server as 1:1 and group calling. One blast radius for two
      # products with opposite risk profiles — a viral stream that exhausted the
      # SFU would have taken calling down with it.
      #
      # THERE IS NO FALLBACK. If these are unset, POST /broadcasts answers 503
      # and says so; it does NOT quietly use LIVEKIT_* (internal/golive/config.go
      # ConfigFromEnv). Setting them to the SAME key or secret as LIVEKIT_* is
      # also refused — Usable() treats an overlap as a misconfiguration, because
      # a copy-paste that silently re-couples the two tiers is the realistic way
      # this isolation gets undone and it must fail rather than work.
      #
      # GOLIVE_LIVEKIT_URL is what the CLIENT dials, so it must be the public
      # wss:// address of the Go Live SFU (port 7890 — see livekit/golive.yaml),
      # not the in-network one and not calling's 7880.
      GOLIVE_LIVEKIT_API_KEY: ${GOLIVE_LIVEKIT_API_KEY:-}
      GOLIVE_LIVEKIT_API_SECRET: ${GOLIVE_LIVEKIT_API_SECRET:-}
      GOLIVE_LIVEKIT_URL: ${GOLIVE_LIVEKIT_URL:-}
      GOLIVE_LIVEKIT_HTTP_URL: ${GOLIVE_LIVEKIT_HTTP_URL:-}
      # Room namespace. Default "golive_" — set only to migrate an existing
      # deployment, since changing it strands rooms already in flight.
      GOLIVE_ROOM_PREFIX: ${GOLIVE_ROOM_PREFIX:-}
      # Host-disconnect grace period (Go duration, e.g. "90s"). How long a host
      # may be gone from the room before the broadcast is ended and its egress
      # stopped — internal/routes/golive_reaper.go. GOLIVE_HOST_REAPER=off
      # disables the sweep entirely if a bad value ever needs neutralising
      # without a rollback.
      GOLIVE_HOST_GRACE: ${GOLIVE_HOST_GRACE:-}
      GOLIVE_HOST_REAPER: ${GOLIVE_HOST_REAPER:-}
      # ── playback origin ──────────────────────────────────────────────
      #
      # NEITHER OF THESE WAS PASSED THROUGH, and that quietly defeated both.
      #
      # livekit.PlaybackBase() reads BROADCAST_CDN_BASE, then PUBLIC_BASE_URL,
      # then falls back to the literal https://api.corefinite.com. With the
      # compose file forwarding neither, the fallback was the ONLY reachable
      # branch: every playback URL on every deployment was hardcoded to that one
      # hostname, and setting BROADCAST_CDN_BASE in .env — the documented way to
      # put a CDN in front of broadcasting — did nothing at all.
      #
      # Found on the bench, where broadcast_sessions.hls_url came back as
      # https://api.corefinite.com/... on a machine that has never been near
      # production. A phone on that LAN would have fetched PRODUCTION segments.
      #
      # BROADCAST_CDN_BASE is the CDN hostname once one is in front (see
      # docs/GOLIVE_DEPLOY.md); PUBLIC_BASE_URL is this deployment's own origin
      # and is the right answer when there is no CDN yet.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BROADCAST_CDN_BASE: ${BROADCAST_CDN_BASE:-}
      # Disk-stored attachments MUST be shared with Node while both backends
      # can serve /uploads (strangler period) — same dir, both processes.
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./uploads-shared:/data/uploads
    ports:
      - "14000:4000"          # direct access for tools/shadow-diff (bench only)
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started

  # ── pgbouncer — connection pooler in front of Postgres (P2.3) ────────
  # Transaction pooling: many app connections multiplex onto few server
  # connections, so scaling go-api replicas doesn't blow max_connections.
  # Go's WithUser uses set_config(..., is_local=true) — txn-scoped, safe here.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: vaultchat
      DB_PASSWORD: ${DB_PASS:-vaultchat_dev}
      DB_NAME: vaultchat
      LISTEN_PORT: "6432"              # edoburu default is 5432 — go-api dials 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"          # app-side connections across replicas
      DEFAULT_POOL_SIZE: "40"          # real Postgres connections per db/user
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaultchat
      POSTGRES_PASSWORD: ${DB_PASS:-vaultchat_dev}
      POSTGRES_DB: vaultchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultchat"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "15432:5432"          # host:container — matches your existing dev port

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "16379:6379"          # host 16379 to avoid clashing with the live app's Redis

  kafka:
    image: apache/kafka:3.8.1          # official Apache image, KRaft built-in
    restart: unless-stopped
    # LEGACY: only the Node EVENT_BUS=kafka path consumes this — off in the
    # Go-first prod shape (in-process fan-out). Revisit at kafka scale-out.
    profiles: ["legacy"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafkadata:/var/lib/kafka/data
    # In-network access is kafka:9092 (used by api/workers). Host 19092 is for tooling.
    ports:
      - "19092:9092"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-vaultchat}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-vaultchat_dev_secret}
    volumes:
      - miniodata:/data
    ports:
      - "19000:9000"          # S3 API
      - "19001:9001"          # web console

  api:
    build:
      context: ./vaultchat-backend
    restart: unless-stopped
    # LEGACY: the Node API is no longer routed (Go owns the client surface).
    # Kept behind a profile for bench parity runs (contract vs Node direct,
    # shadow-diff) and as the emergency per-route rollback target:
    #   docker compose --profile legacy up -d api
    profiles: ["legacy"]
    env_file:
      - path: ./vaultchat-backend/.env     # JWT_SECRET, ADMIN_KEY, etc.
        required: false                     # so `up <infra only>` works without the backend dir present
    environment:
      # Infra wiring overrides .env so the container talks to the compose services.
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vaultchat
      DB_USER: vaultchat
      DB_PASS: ${DB_PASS:-vaultchat_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: ""                # staging Redis has no auth (overrides .env)
      KAFKA_BROKERS: kafka:9092
      # Staging exercises the full Phase-2 delivery path (live app leaves these unset).
      REDIS_ADAPTER: "1"
      EVENT_BUS: kafka
      # Parameterised identically to go-api. This service is the EMERGENCY
      # ROLLBACK target (profiles: ["legacy"]), and bare literals here meant a
      # rollback after an R2 cutover would silently start writing to MinIO —
      # divergence at the exact moment nobody has spare attention for it.
      # Presigned URLs are signed for S3_PUBLIC_ENDPOINT so external clients
      # can reach the store (the in-network minio:9000 isn't resolvable from
      # devices).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://65.21.229.167:19000}
      S3_BUCKET: ${S3_BUCKET:-vaultchat-media}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_USER:-vaultchat}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_PASS:-vaultchat_dev_secret}}
      VALHALLA_URL: http://valhalla:8002   # internal routing engine (POST /nav/route proxies here)
      INTERNAL_EMIT_KEY: ${INTERNAL_EMIT_KEY:-bench-internal-emit}
      # Post-realtime-cutover: Go owns Socket.IO, so any out-of-process Node
      # emitter reaches clients through Go's reverse bridge rather than this
      # process's now-clientless io. Nothing uses it today — the last consumer
      # was the VaultLens worker — but it costs nothing and is what a future
      # worker would need.
      GO_INTERNAL_URL: http://go-api:4000
      # Shared with go-api so either backend can serve disk attachments.
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./uploads-shared:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "13000:3000"          # host 13000 — never clashes with the live pm2 app on :3000

  # valhalla — self-hosted OSM routing engine (POST /route). The API proxies to it
  # via routes/nav.js; it is NEVER exposed publicly (bound to localhost only).
  # First boot: drop an OSM extract at ./valhalla/custom_files/<name>.osm.pbf and
  # the image builds routing tiles into the volume (minutes–tens of minutes for a
  # country extract), then serves on :8002. Rebuilds only when the pbf changes.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"   # localhost only — reached in-network as valhalla:8002
    volumes:
      - ./valhalla/custom_files:/custom_files   # drop <region>.osm.pbf here; tiles build in-place
    environment:
      - server_threads=4
      - use_tiles_ignore_pbf=True   # after the first build, serve tiles without re-parsing the pbf

  # coturn — TURN/STUN relay for WebRTC (calls + VaultBeam Tier-2 P2P). Host
  # networking because the relay allocates a UDP port range (min/max-port in
  # turnserver.conf) that's impractical to map individually. The secret is passed
  # as a flag so it stays in env, never in the mounted conf; it MUST equal the
  # backend's TURN_SECRET, and the backend's TURN_HOST must point at this host's
  # public IP. Open UDP 3478 + 49160-49200 (and TCP 3478) on the host firewall.
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # cert.pem + pkey.pem for TURN-over-TLS (turns:5349). Generate before `up`
      # (deploy steps below) — coturn won't start its TLS listener without them.
      - ./coturn/certs:/etc/coturn/certs:ro
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET:-changeme-must-match-backend}
      --external-ip=${TURN_EXTERNAL_IP:-65.21.229.167}

  # ── livekit — SFU for group calls beyond the mesh cap ────────────────
  # The mesh (app/group-call-active.tsx) caps at 5 because every participant
  # holds N-1 peer connections and N-1 encodes; past that a mid-range phone
  # gives up. An SFU moves that fan-out to the server: each phone publishes ONCE
  # and subscribes to what it needs.
  #
  # Host networking, same reasoning as coturn: RTC needs its ports reachable at
  # the host's real address, and NAT-ing media through the Docker bridge both
  # costs throughput and breaks the ICE candidates clients are handed.
  #
  # Media here is CIPHERTEXT — the client encrypts frames before they leave the
  # device (docs/SFU_SPIKE.md). This container forwards packets it cannot read,
  # which is why "same box as the database" is a capacity question rather than a
  # privacy one.
  #
  # CAPACITY: an SFU is bandwidth-bound, not CPU-bound — it never transcodes,
  # and with frame encryption it could not. Roughly 600 kbps per forwarded
  # stream, so a 10-person call is ~54 Mbps egress. On a shared box, watch for
  # media interrupt load competing with Postgres before you watch CPU.
  #
  # Profile-gated so it does NOT start by default: nothing uses it until
  # CALL_SESSIONS is on and LIVEKIT_* is set. Start with:
  #   docker compose --profile sfu up -d livekit
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.5}
    restart: unless-stopped
    profiles: ["sfu"]
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # "key: secret" pairs. Generate with:
      #   docker run --rm livekit/livekit-server generate-keys
      # The SAME key and secret go to go-api as LIVEKIT_API_KEY/SECRET — the
      # backend signs tokens with them and this server verifies the signature.
      # Deliberately a soft default, NOT ${LIVEKIT_KEYS:?...}: compose
      # interpolates every service regardless of profile, so a required-variable
      # guard here would break `docker compose config`, `ps` and `up` for
      # everyone not running the SFU. LiveKit refuses to start without keys and
      # says so plainly in its own logs, which is the right place for that error.
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:-}
    command: --config /etc/livekit.yaml

  # ── egress — LiveKit room → HLS, the missing half of broadcasting ────
  #
  # Without this a broadcast row is created, a room exists, and no playlist is
  # ever written: internal/livekit/egress.go asks LiveKit to start a room
  # composite and there is nothing to answer. That was the deployment half of
  # the "broadcast never goes live" defect; the code half (a status that only
  # moves on a verified webhook) is in internal/routes/broadcast_webhook.go.
  #
  # VERSION MUST MATCH THE RUNNING SERVER. Egress has its OWN release line —
  # its tags do NOT track livekit-server's. Pinning a guess here would be worse
  # than leaving it unset, so the tag is a variable: read the server's version
  # (`livekit-server --version`) and set LIVEKIT_EGRESS_VERSION to the egress
  # release LiveKit documents as compatible with it. The default below matches
  # the livekit-server pinned above. Both defaults now match what production
  # actually runs (v1.13.5 / v1.14.0) — this file used to say v1.8/v1.8.4 while
  # the box ran the newer pair, so a rebuild from the repository deployed a Go
  # Live that did not work.
  #
  # SYS_ADMIN is required, not optional: egress renders the room in headless
  # Chrome, and Chrome's sandbox needs it. This is why egress is the only
  # CPU-bound service in the stack and why it is profile-gated.
  #
  # Profile-gated with the SFU it depends on: `docker compose --profile sfu up -d egress`
  egress:
    image: livekit/egress:${LIVEKIT_EGRESS_VERSION:-v1.14.0}
    restart: unless-stopped
    profiles: ["sfu"]
    cap_add:
      - SYS_ADMIN
    # livekit runs network_mode: host, so it is NOT on this compose network and
    # cannot be reached as `livekit`. Same mapping caddy already carries.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Egress takes its whole configuration as one YAML document in an env
      # var. Values are interpolated by compose from .env — no secret is
      # written into this file.
      #
      # redis is REQUIRED: it is how egress and livekit-server find each other.
      # The livekit side of that pairing must be enabled too — see the commented
      # redis block in livekit/livekit.yaml, which is off for the single-node
      # setup and has to come on before egress can register.
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ${LIVEKIT_EGRESS_WS_URL:-ws://host.docker.internal:7880}
        insecure: ${LIVEKIT_EGRESS_INSECURE:-true}
        log_level: info
        # Segments (HLS) are written straight to object storage by egress; the
        # bucket, endpoint and region MUST match what
        # internal/livekit/egress.go signs its segment_outputs with, or the
        # playlist lands somewhere the viewer's URL does not point at.
        s3:
          # Follows S3_* like every other consumer. Previously pinned to the
          # MinIO creds while `endpoint` followed S3_ENDPOINT — so pointing
          # S3_ENDPOINT at R2 would have sent MinIO credentials to R2 and
          # killed every broadcast, with the rest of the stack working fine.
          access_key: ${S3_ACCESS_KEY:-${MINIO_USER:-vaultchat}}
          secret: ${S3_SECRET_KEY:-${MINIO_PASS:-vaultchat_dev_secret}}
          bucket: ${BROADCAST_BUCKET:-vaultchat-broadcast}
          endpoint: ${S3_ENDPOINT:-http://minio:9000}
          region: ${S3_REGION:-auto}
          force_path_style: true
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
    # Egress is the only CPU-bound service here and shares a box with Postgres.
    # Unbounded, one runaway transcode starves the database.
    deploy:
      resources:
        limits:
          cpus: "${EGRESS_CPUS:-2}"
          memory: ${EGRESS_MEMORY:-2g}

  # ══════════════════════════════════════════════════════════════════════
  #  GO LIVE BROADCASTING — a SEPARATE LiveKit deployment
  # ══════════════════════════════════════════════════════════════════════
  #
  # Everything below is Go Live's. Nothing above it changes, and neither half
  # needs the other to run:
  #
  #   docker compose --profile sfu    up -d livekit egress          # calling
  #   docker compose --profile golive up -d golive-livekit golive-egress
  #
  # Bring Go Live down and calling is untouched; bring calling down and a
  # broadcast in flight keeps streaming. That independence is the requirement,
  # and the profiles are how it is enforced rather than promised.
  #
  #   component      calling                   Go Live
  #   ─────────────────────────────────────────────────────────────────
  #   SFU service    livekit                   golive-livekit
  #   egress service egress                    golive-egress
  #   config file    livekit/livekit.yaml      livekit/golive.yaml
  #   ports          7880 / 7881 / 7882        7890 / 7891 / 7892
  #   credentials    LIVEKIT_*                 GOLIVE_LIVEKIT_*
  #   rooms          call-<id>                 golive_<broadcast-id>
  #   redis keyspace db 0                      db 3
  #   webhook        /internal/livekit/webhook /internal/golive/webhook
  #   health         GET /health               GET /golive/health
  #   profile        sfu                       golive
  #
  # PROD SAFETY: bring these up BY NAME. `--remove-orphans` against this stack
  # deletes services that are running but not in the composed set, and the live
  # egress container is one of them.
  # Go Live's OWN Redis. Not a luxury and not a db index on the shared one:
  # egress and its server rendezvous through Redis keys, and sharing an
  # instance with the calling egress left the publisher transport never
  # settling — every broadcast dying in 'starting' with nothing in either log.
  # Existed on the production box and in no repository until now, which is
  # precisely why a rebuild from git produced a broken Go Live.
  #
  # No persistence: everything in here is rendezvous state that is worthless
  # after a restart, and an appendonly file would only be a thing to corrupt.
  golive-redis:
    image: redis:7
    restart: unless-stopped
    profiles: ["golive"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16380:6379"

  golive-livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.5}
    restart: unless-stopped
    profiles: ["golive"]
    # Host networking for the same reason as the calling SFU: RTC needs its
    # ports reachable at the host's real address, and NAT-ing media through the
    # Docker bridge both costs throughput and breaks the ICE candidates clients
    # are handed. The two host-networked SFUs coexist because livekit/golive.yaml
    # binds a different port triple — a collision would fail to bind loudly, not
    # corrupt anything quietly.
    network_mode: host
    volumes:
      - ./livekit/golive.yaml:/etc/livekit.yaml:ro
    environment:
      # A DIFFERENT "key: secret" pair from LIVEKIT_KEYS. Generate its own:
      #   docker run --rm livekit/livekit-server generate-keys
      # The same key and secret go to go-api as GOLIVE_LIVEKIT_API_KEY/SECRET.
      # Reusing the calling pair here is refused by the backend (golive.Usable)
      # and defeats the entire point of this block.
      LIVEKIT_KEYS: ${GOLIVE_LIVEKIT_KEYS:-}
    command: --config /etc/livekit.yaml

  # Go Live's own transcoder: room -> HLS. Separate from `egress` above so a
  # broadcast render that pins the CPU cannot starve anything the calling SFU
  # might one day record, and so the two can be restarted independently.
  golive-egress:
    image: livekit/egress:${LIVEKIT_EGRESS_VERSION:-v1.14.0}
    restart: unless-stopped
    profiles: ["golive"]
    # Egress renders the room in headless Chrome and Chrome's sandbox needs it.
    cap_add:
      - SYS_ADMIN
    # golive-livekit runs network_mode: host, so it is NOT on this compose
    # network and cannot be reached by service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EGRESS_CONFIG_BODY: |
        # A DEDICATED Redis, not a db number on the shared one. Egress and its
        # server find each other through these keys, and sharing an instance
        # with the calling egress left the publisher transport never settling —
        # every broadcast dying in 'starting' with no visible error on either
        # side. Separating the instance removes the question instead of
        # answering it with a db index nobody can see from the outside.
        redis:
          address: golive-redis:6379
        api_key: ${GOLIVE_LIVEKIT_API_KEY:-}
        api_secret: ${GOLIVE_LIVEKIT_API_SECRET:-}
        # Port 7890 — the Go Live SFU. 7880 would be the calling one.
        ws_url: ${GOLIVE_EGRESS_WS_URL:-ws://host.docker.internal:7890}
        insecure: ${GOLIVE_EGRESS_INSECURE:-true}
        log_level: info
        # Object storage is deliberately SHARED with the rest of the stack: a
        # bucket is not a media server, and the segment layout must match what
        # internal/livekit/egress.go signs its segment_outputs with or the
        # playlist lands somewhere the viewer's URL does not point at. Isolation
        # here is the media SERVER, not the CDN tier.
        s3:
          access_key: ${S3_ACCESS_KEY:-${MINIO_USER:-vaultchat}}
          secret: ${S3_SECRET_KEY:-${MINIO_PASS:-vaultchat_dev_secret}}
          bucket: ${BROADCAST_BUCKET:-vaultchat-broadcast}
          endpoint: ${S3_ENDPOINT:-http://minio:9000}
          region: ${S3_REGION:-auto}
          force_path_style: true
    depends_on:
      golive-redis:
        condition: service_started
      minio:
        condition: service_started
    # Its own budget, separate from the calling egress's. This is the service
    # that actually burns CPU on a box that also runs Postgres — unbounded, one
    # runaway broadcast transcode starves the database.
    #
    # FOUR IS A FLOOR, NOT A PREFERENCE. Room-composite egress — the mode every
    # broadcast uses — refuses to run below it, and the refusal is a startup log
    # line rather than an error at request time:
    #
    #   ERROR egress not enough cpu for some egress types
    #         {"minimumCpu": 4, "recommended": 4, "available": 2}
    #
    # The service then reports "service ready" and accepts the RPC, so nothing
    # upstream looks broken: StartRoomCompositeEgress simply never produces a
    # playlist and every broadcast dies in 'starting'. Measured on this bench
    # with the previous default of 2 — the container saw 2 cores on an 8-core
    # host purely because of this limit.
    #
    # Raise it, never lower it. On a box with fewer than 4 usable cores, Go Live
    # broadcasting cannot work at all and the honest answer is a bigger box.
    deploy:
      resources:
        limits:
          cpus: "${GOLIVE_EGRESS_CPUS:-4}"
          memory: ${GOLIVE_EGRESS_MEMORY:-2g}

  # The vaultlens-worker service lived here. It was the LAST running Node
  # process in this stack; removing it makes the default service set fully
  # Go-only (caddy + go-api + postgres + pgbouncer + redis + minio + valhalla +
  # coturn). Its MODELSLAB_API_KEY and VAULTLENS_CONCURRENCY went with it — no
  # other service read either.

  # Kafka fan-out worker — consumes message.created and delivers over the Redis
  # adapter. Same image as api, different command. Scale with: --scale fanout-worker=N
  fanout-worker:
    build:
      context: ./vaultchat-backend
    restart: unless-stopped
    # LEGACY: pairs with EVENT_BUS=kafka (off in the Go-first prod shape).
    profiles: ["legacy"]
    command: ["node", "workers/fanout.js"]
    env_file:
      - path: ./vaultchat-backend/.env
        required: false
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vaultchat
      DB_USER: vaultchat
      DB_PASS: ${DB_PASS:-vaultchat_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: ""                # staging Redis has no auth (overrides .env)
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: fanout-workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  # ── monitoring (UITE §19) — opt-in: `dc --profile monitoring up -d` ──
  # Prometheus scrapes go-api's in-network /internal/metrics; Grafana is bound
  # to localhost:3001 (reach it over an SSH tunnel — never exposed publicly).
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Required by prometheus.yml's rule_files. WITHOUT THIS MOUNT
      # prometheus REFUSES TO START — a missing rule file is a fatal
      # config error, not a warning.
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      # Dashboard provider + the SLI board itself, so a fresh stack comes up
      # with the board already there instead of an empty Grafana. The JSON dir
      # must NOT be under provisioning/dashboards — that path holds provider
      # YAML, and mounting a directory over it would shadow the provider.
      - ./monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dash.yml:ro
      - ./monitoring/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
  promdata:
  grafanadata:
