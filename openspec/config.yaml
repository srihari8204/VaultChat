schema: spec-driven

context: |
  VaultChat — private messaging + family location + shop commerce, one app. Target: millions of users.

  Stack
  - App: React Native + Expo (TS), op-sqlite local store, socket.io, LiveKit for all calls, MapLibre (@any-routing) for maps.
  - Backend: Go (vaultchat-backend-go, go 1.26) + Node (vaultchat-backend). Postgres, numbered SQL migrations in
    vaultchat-backend/migrations/NNN_*.sql (137 is the latest applied on prod; 136 ledger entries verified 2026-09-21).
  - Prod: Hetzner, docker compose, host nginx -> caddy. Self-hosted LiveKit, Valhalla (road distance), coturn, R2 for media.

  Conventions that constrain every proposal
  - Thin client: maximum logic on the backend; the app renders server-computed data.
  - RLS is inert in prod (the API connects as superuser) — every handler MUST scope by user itself. Never rely on a policy.
  - Deploys are FILE COPY, not git. A change is not shipped until the file is on prod and the ledger/migration number matches.
  - Broadcasting (Go Live) has its own isolated LiveKit on 7890 with golive_ rooms. Never fall back to the main SFU.
  - messages.id is both sort key and delta-sync cursor: local-only rows MUST use negative ids.
  - Money goes through utils/money.ts. FLAG_SECURE is never lowered, for any feature.
  - Every user-visible distance is by road (Valhalla); geofences stay straight-line circles.
  - Non-trivial logic leaves one runnable check behind: an assert-based *.selftest.ts, never require('fs') in app code
    (it breaks assembleRelease).

  Spec conventions
  - Capabilities are per-feature folders under openspec/specs/<capability>/spec.md.
  - Requirements use SHALL; every requirement carries at least one #### Scenario with WHEN/THEN.
  - Deltas in changes/<id>/specs/ use `## ADDED Requirements` / `## MODIFIED Requirements` and are synced to
    openspec/specs only once the behaviour is deployed AND device-verified.

  OpenSpec + Ponytail workflow
  - OpenSpec defines required behavior; Ponytail guides the smallest correct implementation.
  - Reuse existing code, standard-library or native features, and installed dependencies first.
    Simplification must preserve explicit requirements, security, data-loss protection, and accessibility.

rules:
  proposal:
    - State what is already built versus what is new — this codebase has many half-wired features.
    - Include a "Not building" section.
    - Identify existing code or platform features to reuse before proposing new abstractions or dependencies.
  tasks:
    - Separate "written" from "deployed to prod" from "device-verified"; a task is not done until its stated level is reached.
    - Name the migration number and the exact files that must be copied to prod.
    - Include a Ponytail review of the affected diff and focused validation; keep unrelated optimization out of scope.
