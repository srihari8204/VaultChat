# games.corefinite.com — VaultGames mini-app (WebView from VaultChat).
# Single self-contained Go container on 127.0.0.1:8096 (frontend is embedded in
# the binary — nothing static is served from disk).
#
# :80 only for now — no TLS cert exists for this hostname yet. Works today behind
# Cloudflare in Flexible mode; run certbot once the A record is live to add :443.

server {
    server_name games.corefinite.com;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # game WebSockets are long-lived; do not let nginx cut them
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/games.corefinite.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/games.corefinite.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = games.corefinite.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name games.corefinite.com;
    return 404; # managed by Certbot


}