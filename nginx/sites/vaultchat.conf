# api.corefinite.com — VaultChat backend reverse proxy
# All paths (REST + Socket.IO at /socket.io/) → Caddy on 127.0.0.1:8095
#
# ⚠️ THIS FILE MUST TRACK THE BOX.
#
# It is copied MANUALLY to /etc/nginx/sites-available/vaultchat (nginx/README.md);
# nothing syncs it. The live copy HAD drifted — the /vaultchat-media block below
# existed only on the server, added with the presigned-upload fix. Copying an
# older revision of this file over it would have silently broken every
# attachment upload. Always diff first:
#
#   ssh <host> 'cat /etc/nginx/sites-enabled/vaultchat' | diff nginx/sites/vaultchat.conf -
#   sudo nginx -t && sudo nginx -s reload

# ── upstream keep-alive ──────────────────────────────────────────────
#
# Without this, nginx opened a NEW TCP connection to Caddy for EVERY request.
#
# The global map in nginx.conf line 13 is
#     map $http_upgrade $connection_upgrade { default upgrade; "" close; }
# and that `close` is right for the CLIENT side but fatal upstream: nginx
# forwards it to Caddy, which then closes the pooled connection after every
# REST call. Each message POST therefore paid a fresh TCP handshake to a
# process sitting on the same host.
#
# A LOCAL map rather than editing nginx.conf's: that one is shared with admin,
# games, jump, monitor, portainer and vaultchat-stream. Changing it there would
# alter six other vhosts to fix one.
#
# HONEST SIZING: this hop is loopback, so the handshake it removes costs well
# under a millisecond. It is correct and free, not a cure. Measured end-to-end,
# a cold request from India is ~640ms, of which ~600ms is three round trips to
# Germany at ~200ms each. The latency lives in geography and in the fact that
# every send opens a NEW connection — not in this hop. See the plan's Stage 2.
map $http_upgrade $vc_conn_upgrade {
    default upgrade;   # websocket handshake — must still say "upgrade"
    ''      '';        # ordinary REST — empty, so the pooled connection lives
}

upstream vc_caddy {
    server 127.0.0.1:8095;
    # Idle connections held open to Caddy. Well above this box's concurrency;
    # the cost is one fd each. keepalive_requests caps reuse so a long-lived
    # connection cannot accumulate upstream state indefinitely.
    keepalive          64;
    keepalive_timeout  60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name api.corefinite.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.corefinite.com;

    ssl_certificate     /etc/letsencrypt/live/api.corefinite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.corefinite.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Session resumption. MEASURED AS ALREADY WORKING before this change —
    # TLS1.2 reports `Reused`, TLS1.3 issues a Resumption PSK with an 86400s
    # ticket. (openssl s_client -reconnect reports "New" on TLS1.3 regardless;
    # that is a reporting artifact, not a broken server. Test with -tls1_2.)
    #
    # So this is a widening, not a fix: 10m holds ~40k sessions, and a phone
    # that was away for an afternoon falls out of that cache long before the
    # ticket itself expires. Cheap insurance, not a latency win — the handshake
    # it saves is already being saved for most reconnects.
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    client_max_body_size 100M;

    # Object store — presigned attachment uploads.
    #
    # Prefix has NO trailing slash on purpose: S3 clients probe
    # HEAD /<bucket> to check existence, which /<bucket>/ never matches.
    #
    # Host is passed through unchanged because SigV4 signs it — rewriting
    # it invalidates every signature and turns uploads into 403s.
    #
    # NOT on the keep-alive upstream: this goes straight to MinIO, and the
    # unbuffered streaming below is what keeps a large upload from being
    # spooled to disk first.
    location /vaultchat-media {
        proxy_pass              http://127.0.0.1:19000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      3600;
        proxy_send_timeout      3600;
    }

    location / {
        proxy_pass         http://vc_caddy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $vc_conn_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
