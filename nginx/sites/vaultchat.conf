# api.corefinite.com — VaultChat backend reverse proxy
# All paths (REST + Socket.IO at /socket.io/) → localhost:3000

server {
    listen 80;
    server_name api.corefinite.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.corefinite.com;

    ssl_certificate     /etc/letsencrypt/live/api.corefinite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.corefinite.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
