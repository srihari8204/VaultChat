# stream.corefinite.com — HLS broadcast origin (migration 079).
#
# Cloudflare is PROXIED for this hostname and caches segments at the edge, so
# this block serves the origin only: a few requests per segment, not one per
# viewer. That is the whole reason broadcast can scale past what the box could
# ever serve directly.
#
# Broadcast media is deliberately NOT end-to-end encrypted (documented in
# migration 079 and surfaced to clients as broadcast_sessions.e2ee), which is
# why it can be cached by a third party at all. Nothing here must ever be used
# for chat attachments — those live in a private bucket.
#
# Both :80 and :443 answer so the zone works under either Cloudflare SSL mode:
# Flexible reaches us on :80, Full on :443. Client<->Cloudflare is HTTPS either
# way.

server {
    listen 80;
    server_name stream.corefinite.com;
    location / { proxy_pass http://127.0.0.1:8095; include /etc/nginx/vaultchat-stream-proxy.conf; }
}

server {
    listen 443 ssl http2;
    server_name stream.corefinite.com;

    ssl_certificate     /etc/letsencrypt/live/api.corefinite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.corefinite.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / { proxy_pass http://127.0.0.1:8095; include /etc/nginx/vaultchat-stream-proxy.conf; }
}
