server {
    server_name admin.corefinite.com;
    root /var/www/admin.corefinite.com;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /logapi/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_read_timeout 30;
    }

    # Lock the panel down to your IP(s) — recommended:
    # allow 1.2.3.4;  deny all;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.corefinite.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.corefinite.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = admin.corefinite.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.corefinite.com;
    return 404; # managed by Certbot


}
