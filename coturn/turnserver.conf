# coturn/turnserver.conf — TURN/STUN relay for VaultChat WebRTC (calls + VaultBeam
# Tier-2 P2P). Without a relay, WebRTC fails across symmetric NATs (most mobile
# carriers) — this was the documented cause of calls silently not connecting.
#
# Auth: coturn's REST "use-auth-secret" pattern, byte-for-byte what the backend's
# GET /user/turn already issues:
#   username   = "<expiry-unix>:<user-id>"
#   credential = base64(HMAC-SHA1(TURN_SECRET, username))
# The static-auth-secret below MUST equal the backend's TURN_SECRET env.
#
# The docker-compose `coturn` service passes the secret + external IP as flags
# (env-interpolated), so the only values hard-set here are the safe static ones.
# Run with host networking (relay needs a UDP port range, impractical to map).

realm=vaultchat
fingerprint
use-auth-secret

# STUN/TURN listeners (UDP + TCP on 3478) + TLS-TURN on 5349.
listening-port=3478

# TURN-over-TLS (turns:5349) — punches through firewalls that block plain 3478
# and only allow TLS. This is exactly the `turns:<host>:5349` entry the backend's
# GET /user/turn already advertises. Requires cert.pem + pkey.pem mounted at
# /etc/coturn/certs (see the deploy steps: Let's Encrypt for TURN_HOST in prod, or
# a self-signed pair for testing — self-signed lets coturn start + keeps 3478
# working, but real clients only trust turns: with a valid cert for the host).
tls-listening-port=5349
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/pkey.pem
# 443 is intentionally NOT used — nginx owns it on the app host.

# Relay allocation range. The full ephemeral range, matching the ufw rule
# (49152:65535/udp) — NOT the 40-port window this once held.
#
# Each relayed session takes its own port, so 40 ports is a hard ceiling of ~40
# concurrent relayed streams for the entire service, and TURN relay is the path
# used by exactly the users who have no other option: carrier-grade NAT, locked
# down corporate wifi. They would have hit "call will not connect" while the box
# sat idle, and nothing would have logged a cause.
min-port=49152
max-port=65535

# Hardening: no legacy TLS, no multicast peers, no loopback relay, quota guards.
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-cli
stale-nonce=600
max-bps=0
# Sized to the relay range above. A video call allocates more than one
# session, so 12 per user throttled ordinary use, not abuse.
user-quota=100
total-quota=5000

# Deny relaying to internal/link-local ranges (SSRF hardening — a client must not
# be able to make the TURN server dial the platform's private network).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Relay bookkeeping. Channels and permissions expire on the RFC 5766 defaults
# otherwise (600s / 300s); pinning them keeps a dropped client from holding a
# relay port for ten minutes when the range is under pressure.
channel-lifetime=300
permission-lifetime=300

# Verbose, not "extra verbose". One line per allocation is what makes a
# "calls do not connect" report answerable at all — coturn is otherwise silent
# about refusals. Revisit if the log volume becomes a problem.
verbose
