// crypto-core — Android module linking the Rust crypto staticlib into a Nitro
// HybridObject ("CryptoCore"). Copied into android/crypto-core by
// plugins/withCryptoCore.js during expo prebuild (only when cargo-ndk exists).
apply plugin: "com.android.library"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def reactNativeArchitectures() {
    def value = rootProject.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

android {
    namespace "com.vaultchat.cryptocore"
    compileSdkVersion safeExtGet("compileSdkVersion", 36)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters(*reactNativeArchitectures())
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }

    packagingOptions {
        excludes = ["META-INF", "META-INF/**"]
        // libc++_shared / libjsi ship with the app — don't double-package.
        pickFirst "**/libc++_shared.so"
    }
}

dependencies {
    // Substituted to the local react-android by the React gradle plugin.
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-android"
    implementation project(":react-native-nitro-modules")
}

// ── Rust: build libcrypto_core.a per ABI via cargo-ndk before CMake links it ──
def rustDir = new File(projectDir, "../../services/crypto/rust").canonicalFile
def abiTargets = [
    "arm64-v8a"  : "aarch64-linux-android",
    "armeabi-v7a": "armv7-linux-androideabi",
    "x86"        : "i686-linux-android",
    "x86_64"     : "x86_64-linux-android",
]

// nav-core is built by the SAME task family and linked into the same .so —
// see CMakeLists.txt for why it does not get a module of its own.
def navRustDir = new File(projectDir, "../../services/nav/rust").canonicalFile

tasks.register("cargoBuildCryptoCore") {
    description = "Builds the crypto-core Rust staticlib for all requested ABIs (cargo-ndk)"
    doLast {
        reactNativeArchitectures().each { abi ->
            if (abiTargets[abi] == null) {
                throw new GradleException("crypto-core: unsupported ABI ${abi}")
            }
            exec {
                workingDir rustDir
                environment "ANDROID_NDK_HOME", android.ndkDirectory.absolutePath
                commandLine "cargo", "ndk", "-t", abi, "build", "--release", "--lib"
            }
        }
    }
}

tasks.register("cargoBuildNavCore") {
    description = "Builds the nav-core Rust staticlib for all requested ABIs (cargo-ndk)"
    doLast {
        reactNativeArchitectures().each { abi ->
            if (abiTargets[abi] == null) {
                throw new GradleException("nav-core: unsupported ABI ${abi}")
            }
            exec {
                workingDir navRustDir
                environment "ANDROID_NDK_HOME", android.ndkDirectory.absolutePath
                commandLine "cargo", "ndk", "-t", abi, "build", "--release", "--lib"
            }
        }
    }
}

preBuild.dependsOn("cargoBuildCryptoCore")
preBuild.dependsOn("cargoBuildNavCore")
