apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: go-api
  labels:
    release: kube-prometheus-stack
spec:
  # PodMonitor, not ServiceMonitor. A Service target load-balances scrapes
  # across pods, so you get one pod's numbers at random each interval. Per-pod
  # series are required for sockets_local to work as an autoscaling signal and
  # to see a single hot replica at all.
  selector:
    matchLabels:
      {{- include "crazzychat.goApiSelector" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /internal/metrics
      interval: 15s
