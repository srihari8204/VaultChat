# The two SFUs run in their own namespaces so a leaked credential is contained
# to one of them. An Ingress can only reference a Service in its OWN namespace,
# so these aliases give the ingress a local name for a cross-namespace target.
#
# Signalling only. Nothing about media passes through here.
apiVersion: v1
kind: Service
metadata:
  name: livekit-calling
spec:
  type: ExternalName
  externalName: livekit-calling.media-calls.svc.cluster.local
  ports: [{ port: 7880 }]
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-golive
spec:
  type: ExternalName
  externalName: livekit-golive.media-golive.svc.cluster.local
  ports: [{ port: 7890 }]
