apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-api
spec:
  # One pod at a time during voluntary disruption (node drains, cluster
  # upgrades). Each eviction forces ~1500 clients to reconnect; allowing two
  # concurrent drains doubles that burst for no operational gain.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "crazzychat.goApiSelector" . | nindent 6 }}
