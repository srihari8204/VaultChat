# Migrations run once per release, before any new pod starts.
#
# A Job with a pre-install/pre-upgrade hook, NOT an initContainer: an
# initContainer runs on every pod of every replica, so a 30-replica rollout
# would start 30 migrators against one database. migrate.js is ledgered and
# transactional so they would serialise rather than corrupt, but 29 pods would
# block behind one migration for no reason.
#
# backoffLimit 0 is deliberate. A failed migration must stop the release, not
# retry into a partially-applied schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: migrate
          image: {{ .Values.migrator.repository }}:{{ required "migrator.tag is required" .Values.migrator.tag }}
          command: ["node", "migrate.js", "up"]
          env:
            # DIRECT to Postgres (25060), not the transaction pool (25061).
            # DDL and session-level advisory locks do not survive transaction
            # pooling — the lock would be released at the end of each statement's
            # transaction, which is precisely when it needs to be held.
            - name: DB_HOST
              value: {{ .Values.config.db.host | quote }}
            - name: DB_PORT
              value: "25060"
            - name: DB_NAME
              value: "vaultchat"
            - name: DB_USER
              value: {{ .Values.config.db.user | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef: { name: cc-db, key: DB_PASS }
            - name: PGSSLMODE
              value: "require"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1", memory: "512Mi" }
