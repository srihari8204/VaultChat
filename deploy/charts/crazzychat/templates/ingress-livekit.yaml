# Separate Ingress objects for the two SFU signalling routes.
#
# Not a stylistic split: nginx.ingress.kubernetes.io/rewrite-target applies to
# the WHOLE Ingress object, so a rewrite rule cannot share an object with the
# paths that must not be rewritten. One object per rewrite.
#
# ONLY SIGNALLING comes through here. Media (UDP 7882/7892) goes straight to
# the media node's public IP and never touches the load balancer — routing it
# through a proxy would put the ingress in the path of every RTP packet and
# break ICE, since the candidates a client receives advertise the node's own
# address.
{{- range $name, $cfg := dict "livekit" (dict "prefix" "/livekit" "svc" "livekit-calling" "port" 7880) "golive" (dict "prefix" "/golive-livekit" "svc" "livekit-golive" "port" 7890) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crazzychat-{{ $name }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $.Values.ingress.readTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $.Values.ingress.readTimeout | quote }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts: [{{ $.Values.ingress.hosts.legacy }}]
      secretName: tls-corefinite
    - hosts: [{{ $.Values.ingress.hosts.primary }}]
      secretName: tls-crazzychat
  rules:
    {{- range $h := list $.Values.ingress.hosts.legacy $.Values.ingress.hosts.primary }}
    - host: {{ $h }}
      http:
        paths:
          - path: {{ $cfg.prefix }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $cfg.svc }}
                port: { number: {{ $cfg.port }} }
    {{- end }}
{{- end }}
