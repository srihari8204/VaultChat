# Defense in depth for the unauthenticated metrics endpoint.
#
# The ingress already refuses /internal/* publicly, but that is one rule in one
# object. GET /internal/metrics has no auth of its own, so anything with pod
# network access could read the fleet's metrics if the ingress rule were ever
# edited away. This closes the gap at the network layer, where it does not
# depend on routing config staying correct.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-api-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "crazzychat.goApiSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        # The SFUs post egress lifecycle webhooks back to go-api. Without this
        # a broadcast is created, a room exists, and its status never leaves
        # "starting" — broadcast_webhook.go has no other signal.
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: media-calls }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: media-golive }
      ports:
        - { protocol: TCP, port: 4000 }
