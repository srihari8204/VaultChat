# A backend whose only job is to return 404 for /internal/*.
#
# See ingress-main.yaml for why this is a pod rather than a snippet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: deny-internal-nginx
data:
  default.conf: |
    server {
      listen 8080;
      # Deliberately 404, not 403. A 403 confirms the path exists.
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deny-internal
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: deny-internal }
  template:
    metadata:
      labels: { app.kubernetes.io/component: deny-internal }
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      volumes:
        - { name: conf, configMap: { name: deny-internal-nginx } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: deny-internal
spec:
  selector: { app.kubernetes.io/component: deny-internal }
  ports: [{ port: 8080, targetPort: 8080 }]
