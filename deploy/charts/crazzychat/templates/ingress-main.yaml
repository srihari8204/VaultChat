apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crazzychat
  annotations:
    # ingress-nginx defaults to 1 MB. The current nginx allows 100M and
    # UPLOAD_MAX_BYTES matches it. Omit this and every relayed attachment
    # upload returns 413 the moment traffic cuts over. (The 2 GB multipart path
    # goes direct to object storage via presigned URLs and never touches the
    # ingress, so only the relay path is affected — which makes it easy to miss
    # in testing.)
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.bodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.readTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.readTimeout | quote }}
    # Large uploads must stream, not spool to the controller's disk first.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.legacy }}
        - {{ .Values.ingress.hosts.stream }}
      secretName: tls-corefinite
    - hosts:
        - {{ .Values.ingress.hosts.primary }}
      secretName: tls-crazzychat
  rules:
    {{- range $key, $host := .Values.ingress.hosts }}
    - host: {{ $host }}
      http:
        paths:
          # ── /internal/* is refused at the edge ────────────────────────
          #
          # This reproduces the Caddyfile's `respond 404` and it is
          # load-bearing, not defensive tidiness. /internal/emit and
          # /internal/chat-event are key-guarded, but GET /internal/metrics is
          # NOT authenticated at all — this rule is the only thing keeping the
          # fleet's metrics private.
          #
          # A dedicated 404 backend rather than a server-snippet: ingress-nginx
          # ships with allow-snippet-annotations=false by default, so enabling
          # snippets to express this would be a cluster-wide security
          # regression to solve a one-line routing problem. ingress-nginx sorts
          # paths longest-first, so /internal wins over /.
          - path: /internal
            pathType: Prefix
            backend:
              service:
                name: deny-internal
                port: { number: 8080 }

          # ── Play-review and App Links static pages ────────────────────
          #
          # Served by their own pod so they stay up when go-api does not. A
          # privacy policy URL that 502s fails Google Play review, and an
          # assetlinks.json that 404s silently turns every Private Live
          # invitation link into a browser tab instead of opening the app.
          - path: /.well-known/assetlinks.json
            pathType: Exact
            backend:
              service:
                name: static-pages
                port: { number: 8080 }
          - path: /privacy
            pathType: Prefix
            backend:
              service:
                name: static-pages
                port: { number: 8080 }
          - path: /delete-account
            pathType: Prefix
            backend:
              service:
                name: static-pages
                port: { number: 8080 }

          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-api
                port: { number: 4000 }
    {{- end }}
