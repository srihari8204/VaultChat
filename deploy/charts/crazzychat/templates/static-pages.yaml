# The Play-review and App Links pages, served independently of go-api.
#
# Copied from caddy/public/ at chart-build time. That directory stays the source
# of truth — this repo has been bitten repeatedly by config that drifted between
# git and the box, so CI asserts the two are identical rather than trusting
# anyone to remember.
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-pages
data:
  assetlinks.json: |
{{ .Files.Get "files/assetlinks.json" | indent 4 }}
  privacy.html: |
{{ .Files.Get "files/privacy.html" | indent 4 }}
  delete-account.html: |
{{ .Files.Get "files/delete-account.html" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-pages-nginx
data:
  default.conf: |
    server {
      listen 8080;
      root /srv;

      # Extensionless paths so the URLs printed in the Play console stay clean.
      location = /privacy        { try_files /privacy.html =404; }
      location = /privacy.html   { try_files /privacy.html =404; }
      location = /delete-account      { try_files /delete-account.html =404; }
      location = /delete-account.html { try_files /delete-account.html =404; }

      location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files /assetlinks.json =404;
      }

      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-pages
spec:
  # Two replicas for a page whose entire job is to be reachable when other
  # things are not.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: static-pages }
  template:
    metadata:
      labels: { app.kubernetes.io/component: static-pages }
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: content, mountPath: /srv, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          readinessProbe:
            httpGet: { path: /.well-known/assetlinks.json, port: 8080 }
            periodSeconds: 10
      volumes:
        - { name: content, configMap: { name: static-pages } }
        - { name: conf, configMap: { name: static-pages-nginx } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: static-pages
spec:
  selector: { app.kubernetes.io/component: static-pages }
  ports: [{ port: 8080, targetPort: 8080 }]
