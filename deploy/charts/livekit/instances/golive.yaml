# A SEPARATE deployment, not a second replica. Different ports, different
# credentials, its own Valkey cluster and its own webhook path.
#
# The separation is enforced in code: internal/golive/config.go treats
# credentials that overlap calling's as a misconfiguration and refuses to start
# rather than quietly re-coupling two products with opposite risk profiles — a
# viral broadcast that exhausted the SFU would otherwise take calling down.
name: livekit-golive
pool: media-golive
redisDB: 3
secretName: cc-livekit-golive
ports: { signal: 7890, rtcTCP: 7891, rtcUDP: 7892, prometheus: 6799 }
webhookURL: http://go-api.crazzychat.svc.cluster.local:4000/internal/golive/webhook
resources:
  requests: { cpu: "1", memory: "1Gi" }
  limits:   { cpu: "3", memory: "3Gi" }
