apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
data:
  livekit.yaml: |
    port: {{ .Values.ports.signal }}
    log_level: info
    logging:
      json: true

    rtc:
      tcp_port: {{ .Values.ports.rtcTCP }}
      udp_port: {{ .Values.ports.rtcUDP }}
      port_range_start: 0
      port_range_end: 0

      # node_ip is NOT set here, and that is the whole point.
      #
      # LiveKit reads this file verbatim — it does NOT expand ${VAR}, which this
      # repo learned the hard way when a placeholder was delivered to the server
      # as fourteen literal characters. On one box the answer was to hardcode
      # the address. On Kubernetes every node has a different public IP and
      # nodes are replaced, so a hardcoded value means every SFU pod advertises
      # someone else's address in its ICE candidates and no media ever connects.
      #
      # The address is supplied instead as --node-ip on the command line, read
      # at startup from the DigitalOcean metadata service by an initContainer.
      # That sidesteps the no-expansion limitation entirely and is deterministic,
      # unlike use_external_ip, which depends on a third-party STUN server being
      # reachable at the exact moment a pod boots.
      use_external_ip: false

    redis:
      address: REDIS_ADDRESS_PLACEHOLDER
      db: {{ .Values.redisDB | default 0 }}
      use_tls: true

    room:
      empty_timeout: {{ .Values.room.emptyTimeout }}
      departure_timeout: {{ .Values.room.departureTimeout }}
      max_participants: {{ .Values.room.maxParticipants }}

    # Media is ciphertext — clients encrypt frames before they leave the device.
    # This server forwards packets it cannot read and could not transcode if
    # asked to, which is why co-tenancy is a capacity question and not a privacy
    # one.
    turn:
      enabled: false

    prometheus_port: {{ .Values.ports.prometheus }}

    webhook:
      urls:
        - {{ .Values.webhookURL }}
