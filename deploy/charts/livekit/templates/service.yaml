# Signalling only, and only reachable in-cluster. Media does not pass through a
# Service — it goes to the node's own address.
#
# A ClusterIP in front of signalling is safe even across multiple SFU nodes:
# LiveKit relays signalling internally when a participant's WebSocket lands on a
# node that does not hold the room, so no session affinity is needed.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  selector: { app: {{ .Values.name }} }
  ports:
    - { name: signal, port: {{ .Values.ports.signal }}, targetPort: {{ .Values.ports.signal }} }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.name }}
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: {{ .Values.name }} }
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
