apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.name }}
spec:
  selector:
    matchLabels: { app: {{ .Values.name }} }
  template:
    metadata:
      labels: { app: {{ .Values.name }} }
    spec:
      # hostNetwork because RTC must advertise the node's real address. NAT-ing
      # media through the pod network both costs throughput and hands clients
      # ICE candidates that cannot be reached.
      hostNetwork: true

      # MANDATORY, and the single most likely thing to be forgotten here.
      #
      # A hostNetwork pod uses the NODE's /etc/resolv.conf and cannot resolve
      # *.svc.cluster.local without this. Omit it and every egress webhook DNS
      # lookup fails — a broadcast is created, a room exists, and its status
      # never leaves "starting", because broadcast_webhook.go has no other
      # signal that the recording began. Nothing errors loudly.
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        pool: {{ .Values.pool }}
      tolerations:
        - key: workload
          operator: Equal
          value: {{ .Values.pool }}
          effect: NoSchedule

      initContainers:
        # Reads this node's public IPv4 from the DigitalOcean metadata service.
        # 169.254.169.254 is link-local and needs no credentials or egress.
        # DigitalOcean does not NAT — the public address sits directly on the
        # interface — so this value is what belongs in an ICE candidate.
        - name: node-ip
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -eu
              IP=$(curl -fsS --max-time 5 \
                http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address)
              # Fail loudly rather than start an SFU that will advertise nothing.
              # A pod that never becomes ready is diagnosable; one that runs and
              # silently drops every call is not.
              case "$IP" in
                ''|*[!0-9.]*) echo "metadata returned no usable IPv4: '$IP'" >&2; exit 1 ;;
              esac
              echo "$IP" > /shared/node-ip
              echo "node ip: $IP"
          volumeMounts:
            - { name: shared, mountPath: /shared }

      containers:
        - name: livekit
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - sh
            - -c
            - |
              set -eu
              # The Redis address is templated in at runtime rather than baked
              # into the ConfigMap, so the managed endpoint never appears in
              # git or in a rendered manifest.
              sed "s|REDIS_ADDRESS_PLACEHOLDER|${REDIS_ADDRESS}|" \
                /etc/livekit/livekit.yaml > /tmp/livekit.yaml
              exec /livekit-server \
                --config /tmp/livekit.yaml \
                --node-ip "$(cat /shared/node-ip)"
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: LIVEKIT_KEYS }
            - name: REDIS_ADDRESS
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: REDIS_ADDRESS }
          ports:
            - { name: signal, containerPort: {{ .Values.ports.signal }}, hostPort: {{ .Values.ports.signal }} }
            - { name: rtc-tcp, containerPort: {{ .Values.ports.rtcTCP }}, hostPort: {{ .Values.ports.rtcTCP }} }
            - { name: rtc-udp, containerPort: {{ .Values.ports.rtcUDP }}, hostPort: {{ .Values.ports.rtcUDP }}, protocol: UDP }
            - { name: metrics, containerPort: {{ .Values.ports.prometheus }} }
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.ports.signal }} }
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/livekit, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - { name: config, configMap: { name: {{ .Values.name }}-config } }
        - { name: shared, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
