# Instantiated twice from one chart. The compose file's own table of
# differences between the two deployments is exactly this values schema.
name: livekit-calling
pool: media-calls

image:
  repository: livekit/livekit-server
  tag: v1.8

ports:
  signal: 7880
  rtcTCP: 7881
  rtcUDP: 7882
  prometheus: 6789

room:
  emptyTimeout: 60
  departureTimeout: 20
  maxParticipants: 100

# Where egress lifecycle webhooks are POSTed. Cluster DNS, which is why
# dnsPolicy: ClusterFirstWithHostNet is mandatory on this DaemonSet.
webhookURL: http://go-api.crazzychat.svc.cluster.local:4000/internal/livekit/webhook

# Secret holding REDIS_URL (rediss://…) and the API key/secret pair.
secretName: cc-livekit-calling

resources:
  requests: { cpu: "1", memory: "1Gi" }
  limits:   { cpu: "3", memory: "3Gi" }
