apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coturn
spec:
  selector:
    matchLabels: { app: coturn }
  template:
    metadata:
      labels: { app: coturn }
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        pool: {{ .Values.pool }}
      tolerations:
        - key: workload
          operator: Equal
          value: {{ .Values.pool }}
          effect: NoSchedule

      initContainers:
        - name: node-ip
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -eu
              IP=$(curl -fsS --max-time 5 \
                http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address)
              case "$IP" in
                ''|*[!0-9.]*) echo "metadata returned no usable IPv4: '$IP'" >&2; exit 1 ;;
              esac
              echo "$IP" > /shared/node-ip
          volumeMounts:
            - { name: shared, mountPath: /shared }

      containers:
        - name: coturn
          image: {{ .Values.image }}
          command:
            - sh
            - -c
            - |
              set -eu
              # DigitalOcean does not NAT, so --external-ip takes the address
              # alone with no /private suffix.
              exec turnserver \
                -c /etc/coturn/turnserver.conf \
                --static-auth-secret="${TURN_SECRET}" \
                --external-ip="$(cat /shared/node-ip)"
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: TURN_SECRET }
          volumeMounts:
            - { name: config, mountPath: /etc/coturn, readOnly: true }
            - { name: certs, mountPath: /etc/coturn/certs, readOnly: true }
            - { name: shared, mountPath: /shared }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - { name: config, configMap: { name: coturn-config } }
        # cert-manager renews this in place. coturn reads its certificate once
        # at startup, so a renewal without a restart means it keeps serving the
        # expired one — stakater/reloader watches the Secret and restarts the
        # DaemonSet. Without that annotation TLS TURN breaks silently 90 days in.
        - { name: certs, secret: { secretName: {{ .Values.tlsSecretName }} } }
        - { name: shared, emptyDir: {} }
