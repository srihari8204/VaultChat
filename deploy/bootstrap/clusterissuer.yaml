# DNS-01, not HTTP-01.
#
# HTTP-01 cannot complete behind a Cloudflare-proxied record — the challenge
# request never reaches the origin — and cannot issue wildcards. DNS is on
# Cloudflare, so cert-manager's built-in Cloudflare solver is used with a token
# scoped to Zone:DNS:Edit on both zones and nothing else.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: srihari.balla152@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
