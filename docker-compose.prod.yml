# docker-compose.prod.yml — Go-first PROD overrides for the Hetzner box.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Default service set (no profile) is now Go-ONLY:
#   caddy + go-api + postgres + pgbouncer + redis + minio + valhalla + coturn.
#   The Node api / kafka / fanout-worker are behind the `legacy` profile and are
#   NOT started. The vaultlens-worker — the last running Node process — was
#   removed with the VaultLens feature, so no Node runtime remains.
#
# This override only:
#   - binds Caddy to the public ports (80; add 443 + a site address in the
#     Caddyfile when a domain/TLS is configured)
#   - narrows the bench's published ports so nothing but Caddy is reachable from
#     outside: postgres is unpublished entirely, redis and go-api are rebound to
#     127.0.0.1. go-api keeps 14000 on loopback ONLY because livekit runs
#     network_mode: host and posts egress webhooks to it — same reason redis
#     keeps 16379. Neither is a convenience; removing either breaks calls.
#   - mounts the production-only secrets (see the go-api block)
services:
  caddy:
    ports: !override
      - "80:80"
      - "3000:80"            # compatibility: existing APKs point SERVER_URL at :3000
      # - "443:443"          # enable together with a TLS site in the Caddyfile
  go-api:
    ports: !override
      - "127.0.0.1:14000:4000"   # loopback only: host-networked livekit posts egress webhooks here
    # ── Secrets mounted as FILES, not env vars holding the material ────
    #
    # The credential then never appears in `docker inspect`, `docker compose
    # config`, the process environment, or a crash dump — only a path does.
    #
    # No permission change was needed: secrets/ stays 700 root:root and each
    # credential stays 600, owned by uid 1000 — which is also the container's
    # `app` user (Dockerfile: adduser -D app), so the bind mounts are readable
    # inside without widening anything on the host.
    #
    # Deliberately NOT in docker-compose.yml: the bench has no secrets/ dir,
    # and a missing bind-mount source is a hard container start failure.
    environment:
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-sa.json
      GAMES_SIGNING_PRIVATE_KEY_FILE: /run/secrets/games-signing.key
      # The OTHER games keypair, and the other direction: the games server signs
      # turn/invite events, we verify them. Public half only — there is nothing
      # secret in this file, it is mounted alongside the others purely so the
      # two games keys are configured in one place and cannot drift apart.
      GAMES_NOTIFY_PUBLIC_KEY_FILE: /run/secrets/games-notify.pub
    volumes:
      - ./secrets/fcm-service-account.json:/run/secrets/firebase-sa.json:ro
      - ./secrets/games-signing.key:/run/secrets/games-signing.key:ro
      - ./secrets/games-notify.pub:/run/secrets/games-notify.pub:ro
  postgres:
    ports: !override []      # in-network only
  redis:
    # LOOPBACK-ONLY, and it is load-bearing — not a convenience.
    #
    # livekit runs network_mode: host, so it is NOT on the compose network and
    # cannot resolve the `redis` service name. Its livekit.yaml therefore dials
    # 127.0.0.1:16379. With redis publishing no ports at all, nothing listened
    # there, and LiveKit could not allocate a room node — so EVERY authenticated
    # join returned HTTP 500 instead of upgrading the WebSocket:
    #
    #   status 500, path /rtc/v1
    #   "could not get node for room: dial tcp 127.0.0.1:16379: connect:
    #    connection refused"
    #
    # That single failure is why SFU group calls and broadcasting were both
    # dead: RoomService.CreateRoom 500s the same way, and the egress worker's
    # "could not clean egress info" errors are the same refused dial.
    #
    # Bound to 127.0.0.1 rather than 0.0.0.0: the host needs it, the internet
    # must not have it. Redis has no password on this deployment
    # (REDIS_PASS: ""), so a 0.0.0.0 bind would publish an unauthenticated
    # datastore straight onto a public IP.
    #
    # Egress already reaches the SAME instance as `redis:6379` from inside the
    # compose network; this makes livekit-server agree with it, which is what
    # lets the two coordinate at all.
    ports: !override
      - "127.0.0.1:16379:6379"
  minio:
    ports: !override
      - "19000:9000"         # presigned URLs are signed for S3_PUBLIC_ENDPOINT
                             # (console 19001 intentionally NOT published)
