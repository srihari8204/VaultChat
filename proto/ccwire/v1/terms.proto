syntax = "proto3";

package ccwire.v1;

option go_package = "vaultchat/backend-go/internal/ccwire/v1;ccwirev1";

// GET /user/terms — "is there a terms version this user has not accepted?"
//
// SAME RULE AS backup_meta.proto and security_overview.proto: the typed
// response expresses exactly the states the existing JSON response expresses.
// The JSON contract is authoritative and is NOT corrected here.
//
// WHY THIS ENDPOINT. It is the last authenticated request still on JSON that
// runs at cold start: TermsGate mounts from app/_layout.tsx and lib/terms.ts
// asks for this once per launch, so it is on the critical path every single
// time the app opens. Its client is lib/terms.ts, and the decision it feeds is
// termsOutstanding() in lib/termsPolicy.ts.
//
// FAILS OPEN, AND THAT OUTRANKS EVERYTHING ELSE IN THIS FILE. lib/terms.ts
// treats every failure — offline, an old server, a corrupt body — as "not
// outstanding". A protobuf decode failure must land on that same path, which is
// why the decoder throws rather than returning a half-built object: the throw is
// caught by the try/catch fetchTermsState has always had. The worst outcome this
// endpoint can produce is an acceptance screen nobody can dismiss, and that is
// strictly worse than an acceptance recorded a day later.
//
// PRESENCE, AND WHY IT IS THE OPPOSITE CHOICE FROM backup_meta.proto. There the
// no-backup answer OMITS keys, so absence had to decode to a missing key. Here
// the JSON always writes all five keys and spells "never accepted" as an
// explicit `null` — `accepted_version` and `accepted_at` come from a *string and
// a *time.Time that encoding/json renders as null. So these two are `optional`
// (absence must be distinguishable from an accepted version that is literally
// "") and the decoder maps absence to `null`, NOT to undefined. undefined would
// look equal through JSON.stringify — which drops it — and unequal to `in`, so a
// cache or a comparison would silently lose the key on the typed path only.
//
// required_version and url are PLAIN, not optional, because the handler always
// produces a value for both: required_version is "" when no terms are in force
// (proto3 elides "" and the decoder reads it back as "", which is the same
// thing), and termsURL() has a hard-coded default so url is never empty.
//
// accepted_at is a STRING, verbatim, and it is NOT httpx.JSTime. It is a
// *time.Time handed straight to encoding/json, whose MarshalJSON writes RFC3339
// with trailing zeros trimmed — i.e. exactly time.RFC3339Nano, offset included,
// and pgx may hand back a non-UTC location. The typed path must produce that
// identical string, so the Go side formats with time.RFC3339Nano and both the Go
// test and lib/termsNegotiation.selftest.ts pin the result. Not epoch-ms: that
// would be a representation change and would collapse "never accepted" into
// epoch 0.
//
// outstanding is on the wire because the JSON has it, and for no other reason.
// NO CLIENT READS IT: TermsState in lib/termsPolicy.ts does not declare it and
// termsOutstanding() recomputes the same rule locally. It is carried so the two
// representations stay comparable key for key — a decoded object that dropped it
// would not equal the object the JSON path produces.
//
// No jstype: there are no int64 fields here.
message TermsState {
  string          required_version = 1;  // always present; "" means nobody is asked
  optional string accepted_version = 2;  // absent => JSON null, never undefined
  optional string accepted_at      = 3;  // RFC3339Nano verbatim; absent => null
  bool            outstanding      = 4;  // on the wire only; no client reads it
  string          url              = 5;  // always present; termsURL() has a default
}
