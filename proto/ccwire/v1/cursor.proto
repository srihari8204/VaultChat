syntax = "proto3";
package ccwire.v1;
option go_package = "vaultchat/backend-go/internal/ccwire/v1;ccwirev1";

// Cursors are per (chat, kind). Every position is uint64 + JS_STRING:
// a message ordinal must never be silently truncated in JavaScript.
message Cursor {
  string chat_id = 1;
  CursorKind kind = 2;
  uint64 position = 3 [jstype = JS_STRING];
  int64 updated_at_ms = 4 [jstype = JS_STRING];
}

enum CursorKind {
  CURSOR_KIND_UNSPECIFIED = 0;
  CURSOR_KIND_READ        = 1;
  CURSOR_KIND_DELIVERED   = 2;
  CURSOR_KIND_SYNCED      = 3;   // client's backfill watermark
}

message CursorSync {
  repeated Cursor cursors = 1;        // <= max_batch_items (256)
  // Opaque value previously issued in CursorBatch.mutation_continuation.
  // Empty starts mutation backfill; clients must never derive this from a
  // local clock or Cursor.updated_at_ms.
  string mutation_continuation = 2;
}

message CursorBatch {
  repeated Cursor cursors = 1;   // <= max_batch_items
  bool more = 2;
  string continuation = 3;       // opaque cold/message continuation, server-authored
  string mutation_continuation = 4; // opaque mutation continuation, server-authored
}
