syntax = "proto3";
package ccwire.v1;
option go_package = "vaultchat/backend-go/internal/ccwire/v1;ccwirev1";

// Capabilities are negotiated by INTERSECTION. A capability absent from
// either side is inactive.
//
// NO CAPABILITY MAY WEAKEN CRYPTOGRAPHY. There is deliberately no
// "legacy_crypto", no "plaintext_fallback", no "skip_verification"
// capability, and none may ever be added: a transport negotiation is
// not an authorization to downgrade. See §B12.
message Capabilities {
  bool fragmentation      = 1;
  bool resumption         = 2;
  bool batch_cursor_sync  = 3;
  bool datagrams          = 4;  // transport-dependent; EPHEMERAL only
  bool reauth_in_place    = 5;
  bool causal_epochs      = 6;  // §B8.2. If absent on either side, the
                                // server conservatively serializes all
                                // dependent traffic onto CONTROL order
                                // — slower, still correct.
  bool structured_errors  = 7;
  bool app_events_v1      = 8;

  // This peer ACCEPTS typed app-domain bodies inbound (typing_state 81,
  // viewer_state 82, receipt 52, cursor_sync 64, …) instead of the same events
  // wrapped as app_event (100) JSON.
  //
  // IT IS NOT app_events_v1 INVERTED. Field 8 says "I speak app_event JSON";
  // this says "I also decode the typed bodies". A peer may set both, and
  // during the migration every peer does: app_event stays the fallback until
  // typed coverage is complete. Gating typed emit on field 8 would have been
  // repurposing a published flag to mean its own opposite.
  //
  // Emit is gated on the OTHER side's bit, per the intersection rule above: a
  // server that omits this keeps receiving app_event JSON, and an old server
  // omits it by construction. Nothing is guessed — a peer never sends a typed
  // body until the other end has said it decodes them.
  bool typed_app_bodies   = 9;

  // Field numbers 10-14 intentionally unused, and NOT `reserved`: they are the
  // rest of the one-byte-tag range, held open for the next capability bits.
  // `experimental` jumps to 15 so that room exists; without this line the gap
  // reads like five deleted fields, which is the one shape a reader is supposed
  // to treat as poisoned. Frame in envelope.proto states its own gap the same
  // way (`reserved 6 to 15`) — the difference is deliberate: Frame's gap must
  // never be filled, this one is meant to be.
  //
  // A NUMBER HERE IS NEVER REUSED. 1-9 are published; a capability that is
  // retired gets `reserved`, and the next bit takes 10.

  // Forward compatibility: capabilities this build does not know about
  // arrive here and are echoed back unmodified but never activated.
  // An unknown capability is INERT, never assumed.
  repeated string experimental = 15;
}

// Limits. The SERVER's values bind. A client may propose smaller.
// Every 64-bit field is JS_STRING so JavaScript cannot truncate silently.
message Limits {
  uint32 max_frame_bytes              = 1;  // 262144
  uint32 max_opaque_bytes             = 2;  // 196608
  uint64 max_message_body_bytes       = 3 [jstype = JS_STRING];  // 1048576
  uint32 max_fragments_per_message    = 4;  // 16
  uint32 reassembly_lifetime_ms       = 5;  // 30000
  uint64 max_reassembly_bytes         = 6 [jstype = JS_STRING];  // 2097152
  uint32 max_concurrent_reassemblies  = 7;  // 8
  uint32 max_nesting_depth            = 8;  // 6
  uint32 max_repeated_elements        = 9;  // 1024
  uint32 max_string_field_bytes       = 10; // 4096
  uint32 max_batch_items              = 11; // 256
  uint32 max_inflight_per_stream      = 12; // 64
  uint32 heartbeat_interval_ms        = 13; // 10000
  uint32 heartbeat_timeout_ms         = 14; // 5000
}
