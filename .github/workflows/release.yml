name: Release

on:
  push:
    branches: [hetzner-deploy]
    paths:
      - 'vaultchat-backend-go/**'
      - 'vaultchat-backend/migrations/**'
      - 'vaultchat-backend/migrate.js'
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/crazzychat

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@v3

      - name: go-api
        uses: docker/build-push-action@v6
        with:
          context: ./vaultchat-backend-go
          push: true
          # Tagged by commit SHA and nothing else. A floating tag makes
          # "which build is running" unanswerable and rollback a guess.
          tags: ${{ env.REGISTRY }}/go-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: migrator
        uses: docker/build-push-action@v6
        with:
          context: ./vaultchat-backend
          file: ./vaultchat-backend/Dockerfile.migrator
          push: true
          tags: ${{ env.REGISTRY }}/migrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/go-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Requires a manual approval on the environment. The cluster credential is
    # the highest-value secret here; gating its use behind an approval is worth
    # the friction.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - run: doctl kubernetes cluster kubeconfig save crazzychat-prod --expiry-seconds 900

      # --atomic rolls the release back automatically if it does not become
      # healthy, so a bad deploy self-reverts instead of sitting half-applied.
      # The timeout must exceed the rollout: maxSurge 2 with minReadySeconds 60
      # across up to 30 pods is deliberately slow.
      - name: helm upgrade
        run: |
          helm upgrade --install crazzychat deploy/charts/crazzychat \
            --namespace crazzychat --create-namespace \
            --set image.tag=${{ needs.build.outputs.sha }} \
            --set migrator.tag=${{ needs.build.outputs.sha }} \
            -f deploy/envs/prod/values.yaml \
            --atomic --wait --timeout 25m

      - name: verify
        run: |
          kubectl -n crazzychat rollout status deploy/go-api --timeout=5m
          kubectl -n crazzychat get pods -l app.kubernetes.io/component=go-api
