[package]
name = "crypto-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native port of VaultChat's TS crypto core (services/crypto). Formats are FROZEN — proven byte-identical by tests/vectors.rs against services/crypto/__vectors__/*.json."

[lib]
name = "crypto_core"
crate-type = ["lib", "staticlib"]

[dependencies]
x25519-dalek = "2"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = "1"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
