# LiveKit SFU — config for the single-box deployment.
#
# Mounted read-only into the container. Keys are NOT here: they come from the
# LIVEKIT_KEYS environment variable so the secret lives in .env alongside
# TURN_SECRET and DB_PASS, never in a file that gets committed.
#
# WHAT AN SFU DOES HERE, AND WHAT IT DELIBERATELY CANNOT
# ------------------------------------------------------
# It forwards media; it does not transcode. With frame encryption on
# (RTCFrameCryptor, see docs/SFU_SPIKE.md) it *could not* transcode even if
# asked — the payloads are ciphertext. That is the security property, and it is
# also why this box needs bandwidth rather than CPU: no encoder ever runs here.

port: 7880

rtc:
  # Single UDP port instead of a 50000–60000 range. A range means fifty thousand
  # firewall rules to reason about on a box that also serves Postgres, Redis and
  # coturn; one port is one rule. LiveKit multiplexes every participant's media
  # over it, which is what makes the simplification safe rather than a limit.
  udp_port: 7882
  # TCP fallback for networks that block UDP outright — corporate wifi, some
  # mobile carriers. Without it those users simply cannot join, and the failure
  # looks like "the call never connects" with no clue why.
  tcp_port: 7881
  # Auto-detect the box's public address via STUN and advertise THAT in ICE
  # candidates. On a cloud VM with a public IP this is the documented setup and
  # it is correct here.
  #
  # It replaced a hardcoded `external_ip: ${LIVEKIT_EXTERNAL_IP}`, which was a
  # bug: LiveKit reads this file as plain YAML and does NOT expand ${VAR}, so
  # that line delivered the literal fourteen characters to a field expecting an
  # IP address. Nothing in the compose file could have fixed it — the
  # substitution has to happen before LiveKit reads the file, and it never did.
  #
  # STUN AUTO-DETECTION IS OFF, AND THE ADDRESS IS STATED OUTRIGHT.
  #
  # This box has one stable public address, so asking STUN to rediscover it on
  # every start buys nothing and can resolve wrong. node_ip removes the guess:
  # LiveKit advertises exactly this in its ICE candidates.
  #
  # Set them together. use_external_ip: true with node_ip present is
  # contradictory, and the older `external_ip: ${LIVEKIT_EXTERNAL_IP}` form was
  # a bug — LiveKit reads this file as plain YAML and does NOT expand ${VAR}, so
  # it delivered fourteen literal characters to a field expecting an IP.
  #
  # Moving to another host means editing this line. That is the cost of not
  # guessing, and it is the cheaper mistake.
  use_external_ip: false
  node_ip: 65.21.229.167

# Reuse the coturn already running on this host rather than LiveKit's embedded
# TURN. One relay, one credential, one thing to monitor — and it is already
# port-forwarded and certificate-managed for the 1:1 mesh calls.
turn:
  enabled: false

# REDIS IS REQUIRED, EVEN ON ONE NODE. This was commented out on the reasoning
# that a single node does not need shared room state — which is true of state
# and false of startup: without a store LiveKit cannot allocate a room node, so
# EVERY authenticated join returned HTTP 500 on /rtc/v1 instead of upgrading the
# WebSocket. Calling was completely down and the SFU still looked healthy.
#
# 127.0.0.1 and not the `redis` service name: this container runs with
# network_mode: host, so it is not on the compose network and cannot resolve
# service names. The port is the one redis is published on for the loopback.
#
# Go Live's SFU uses a DIFFERENT redis on 16380 (livekit/golive.yaml). They must
# never share one: the two servers use the same key names, so a shared instance
# has each reading the other's rooms.
redis:
  address: 127.0.0.1:16379

# Egress lifecycle → the backend, so a broadcast becomes 'live' only when there
# is genuinely something to play.
#
# REQUIRED FOR BROADCASTING TO WORK AT ALL. Without it nothing ever moves a
# session out of 'starting': the backend has no other way to learn that egress
# produced its first segment, and every broadcast times out on the viewer side.
# The receiver is internal/routes/broadcast_webhook.go, which verifies the
# HS256 signature and the body hash LiveKit sends in the Authorization header.
#
# THE URL MUST BE REACHABLE FROM THIS CONTAINER. livekit runs with
# network_mode: host, so it does NOT share the compose network and cannot use
# the `go-api` service name — hence the published loopback port, not `go-api:4000`.
#
# api_key MUST BE EDITED BY HAND ON DEPLOY. It selects which secret from
# LIVEKIT_KEYS signs the webhook, and this file gets NO ${VAR} expansion
# (see use_external_ip above), so a placeholder left in place means every
# webhook is signed with a key the receiver rejects — and broadcasts silently
# never leave 'starting'. Set it to the same key id as LIVEKIT_API_KEY in .env.
webhook:
  api_key: REPLACE_WITH_LIVEKIT_API_KEY
  urls:
    - http://127.0.0.1:14000/internal/livekit/webhook

logging:
  level: info
  # JSON so Loki/Promtail can parse it if log shipping is ever added; harmless
  # when read by a human through `docker compose logs`.
  json: true

# Rooms are created implicitly by the first participant to present a valid
# token, and reaped when the last one leaves. The Go backend never calls the
# LiveKit API — it only signs tokens (internal/livekit/token.go) — so there is
# no room lifecycle to keep in sync between the two.
room:
  # Matches the server-side call teardown: a call whose participants have all
  # gone is over, and holding the room open just consumes memory.
  empty_timeout: 60
  # A room whose creator never arrives should not linger.
  departure_timeout: 20
  # Hard ceiling, well above the 64-participant target, so a runaway client
  # cannot exhaust the box. The REAL limit is the role model in
  # call_participants — this is only a backstop.
  max_participants: 100
